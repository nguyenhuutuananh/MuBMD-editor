# CI: typecheck + unit tests + e2e (real Chrome) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Bun as local development (bun.lockb was created with it).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.32

      # Vite 8 needs Node >= 20.19.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      # ubuntu-latest ships Google Chrome, which playwright-core uses via channel "chrome".
      - name: e2e (desktop build)
        run: bun run test:e2e e2e-shots

      # The web e2e runs on Playwright's Chrome for Testing (see tests/e2e/web.ts); the fallback
      # e2e (no File System Access API) also runs on Playwright's Firefox and WebKit (Safari).
      - name: Install Playwright browsers
        run: bunx playwright-core install --with-deps chromium firefox webkit

      - name: e2e (web build)
        run: bun run test:e2e:web e2e-shots

      - name: "e2e (web build, fallback mode: Chrome, Firefox, WebKit)"
        run: bun run test:e2e:fallback e2e-shots

      - name: "e2e (built web version: PWA, offline, update)"
        run: bun run test:e2e:pwa e2e-shots

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: e2e-shots/
          if-no-files-found: ignore
