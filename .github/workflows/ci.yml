# CI: typecheck + unit tests + e2e (desktop build, web build, and the web fallback in Chromium,
# Firefox and WebKit) on every push and pull request.
# The tests on the real MuMain files (tests/real-files.test.ts, the generated-header check and the
# real-folder part of the e2e) are skipped here: no game checkout on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Bun as local development (the lockfile was created with it).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.32

      # Vite 8 needs Node >= 20.19.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      # ubuntu-latest ships Google Chrome, which playwright-core uses via channel "chrome".
      - name: e2e (desktop build)
        run: bun run test:e2e

      # The web e2e uses Playwright's Chrome for Testing (OPFS stands in for the user's folder).
      - name: Install Playwright browsers
        run: bunx playwright-core install --with-deps chromium firefox webkit

      - name: "e2e (web build: File System Access API, PWA offline)"
        run: bun run test:e2e:web

      - name: "e2e (web fallback: upload + download, Chromium / Firefox / WebKit)"
        run: bun run test:e2e:fallback

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: e2e-shots/
          if-no-files-found: ignore
